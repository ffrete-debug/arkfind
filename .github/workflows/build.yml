name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The real gate. These are the pure-logic tests (Geo / NameMatch / Session /
  # Text): standard library only, no ARK SDK, so they must pass on every push
  # and PR.
  tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DARKFIND_BUILD_TESTS=ON -DARKFIND_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # Compiles the actual server DLL against the ARK: Survival Evolved plugin SDK.
  #
  # The SDK is Michidu/ARK-Server-API: headers live in version/Core/Public and
  # the import library is out_lib/ArkApi.lib. Both are committed to that repo, so
  # a shallow clone is all this needs. (ServersHub/ServerAPI is the *Ascended*
  # SDK - a different API - which is why this job does not use it.)
  plugin-dll:
    name: Plugin DLL (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the ARK Server API SDK
        run: git clone --depth 1 https://github.com/Michidu/ARK-Server-API.git ${{ runner.temp }}/ArkServerApi

      - name: Resolve SDK paths
        id: sdk
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}/ArkServerApi"
          $include = Join-Path $root 'version/Core/Public'
          $lib = Join-Path $root 'out_lib/ArkApi.lib'

          foreach ($path in @($include, $lib)) {
            if (-not (Test-Path $path)) {
              throw "Expected SDK path is missing: $path"
            }
          }

          $include = $include -replace '\\', '/'
          $lib = $lib -replace '\\', '/'
          Write-Host "ARKAPI_SDK_DIR=$include"
          Write-Host "ARKAPI_LIB=$lib"
          "include=$include" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "lib=$lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        run: >
          cmake -B build -A x64
          -DARKFIND_BUILD_PLUGIN=ON
          -DARKFIND_BUILD_TESTS=OFF
          "-DARKAPI_SDK_DIR=${{ steps.sdk.outputs.include }}"
          "-DARKAPI_LIB=${{ steps.sdk.outputs.lib }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ArkFind-dll
          path: |
            build/Release/ArkFind.dll
            build/Release/ArkFind.pdb
          if-no-files-found: error
